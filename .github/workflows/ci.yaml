---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # On main each run is that commit's verification record, so it gets a run-unique
  # group and nothing there queues behind or evicts anything else. Disabling
  # cancellation alone would not be enough: a concurrency group holds one running
  # plus one pending run, and a third push cancels the pending one, so a second
  # push's checks would still be lost. A cancelled check is not a failed check,
  # so main would report green over verification that never completed.
  #
  # Pull requests keep the ref-keyed group, so superseded runs there still cancel.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Kyverno CLI defines the semantics of the behavior gate below, so it is pinned
  # rather than floating: an unpinned CLI can change how `kyverno test` evaluates the
  # catalog without a single line of this repository changing.
  # Keep at or above the `policies.kyverno.io/minversion` floor the policies declare —
  # the "Verify Kyverno CLI" step below enforces that, so the two cannot drift apart.
  # The annotation below lets Renovate propose bumps (.github/renovate.json). A
  # Renovate PR carries only the version, so it goes red on the digest check below —
  # that red PR is the staleness SIGNAL; the delivered bump (version + digests,
  # verified) ships on an agent-authored branch, since dependency-bot branches are
  # hands-off (rationale on #16, incl. why an auto-mergeable path was rejected).
  # renovate: datasource=github-releases depName=kyverno/kyverno extractVersion=^v(?<version>.*)$
  KYVERNO_CLI_VERSION: "1.18.2"
  # Digests are pinned HERE rather than taken from the release's own checksums.txt: a Git
  # tag is mutable, so a checksum fetched alongside the asset it verifies would simply be
  # replaced together with it. They are the IMMUTABLE anchor — the cosign identity check
  # below proves who built the asset, but an upstream actor with repo write could re-tag
  # and re-run the release workflow to mint the same identity for a replacement; only
  # this repo-side digest detects that. Bump these with KYVERNO_CLI_VERSION, from the
  # upstream checksums.txt of the new release.
  KYVERNO_CLI_SHA256_ARM64: cc69bc6638da1993146c134943fac91cbc9dd0ce60a3e88c6d7c518ae00f1abc
  KYVERNO_CLI_SHA256_X86_64: a461096a3111e6a4134c2bd135ddd8e0bfd9d466a5d5b17810b76a484fffdae4

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Check documentation links
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
        with:
          enabled: "true"

      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true

      - name: Prepare disposable README defect
        run: |
          mkdir -p "$RUNNER_TEMP/retired-links-fixture/.github"
          cp README.md AGENTS.md "$RUNNER_TEMP/retired-links-fixture/"
          printf '\n[Retired catalogue](https://github.com/devantler-tech/reusable-workflows)\n' >> "$RUNNER_TEMP/retired-links-fixture/README.md"
          cp .github/retired-repo-links.json "$RUNNER_TEMP/retired-links-fixture/.github/retired-repo-links.json"

      - name: Reject the retired README link
        id: retired
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
        with:
          enabled: "true"
          working-directory: ${{ runner.temp }}/retired-links-fixture

      - name: Reject missing configuration
        id: missing
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json

      - name: Verify negative action outcomes
        if: ${{ always() }}
        env:
          CLEAN_VALIDATED: ${{ steps.links.outputs.validated }}
          RETIRED_OUTCOME: ${{ steps.retired.outcome }}
          RETIRED_VALIDATED: ${{ steps.retired.outputs.validated }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_VALIDATED: ${{ steps.missing.outputs.validated }}
        run: |
          test "$CLEAN_VALIDATED" = true
          test "$RETIRED_OUTCOME" = failure
          test -z "$RETIRED_VALIDATED"
          test "$MISSING_OUTCOME" = failure
          test -z "$MISSING_VALIDATED"

      - name: Checkout released validator for diagnostic proof
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
          path: .retired-repo-links-validator
          persist-credentials: false

      - name: Verify exact failure codes and diagnostics
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go -C .retired-repo-links-validator/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-repo-links" .
          bash scripts/test-retired-repo-links.sh "$RUNNER_TEMP/retired-repo-links"

  required:
    needs: [retired-repo-links]
    if: ${{ always() }}
    name: CI - Required Checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Require documentation guard
        env:
          RESULT: ${{ needs.retired-repo-links.result }}
        run: test "$RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # cosign is a verifier, not a gate-semantics dependency, so it floats with the
      # rest of the Homebrew tooling (the rationale recorded on #16).
      - name: Install policy tooling
        run: brew install actionlint cosign kubernetes-cli shellcheck yamllint yq zizmor

      - name: Install pinned Kyverno CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          case "$(uname -m)" in
            arm64) arch=arm64; expected="${KYVERNO_CLI_SHA256_ARM64}" ;;
            x86_64) arch=x86_64; expected="${KYVERNO_CLI_SHA256_X86_64}" ;;
            *) echo "::error::unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          asset="kyverno-cli_v${KYVERNO_CLI_VERSION}_darwin_${arch}.tar.gz"
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          gh release download "v${KYVERNO_CLI_VERSION}" \
            --repo kyverno/kyverno \
            --pattern "${asset}" \
            --pattern "${asset}.sigstore.json" \
            --dir "${workdir}"

          # Layer 1 — immutable anchor: the repo-pinned digest (see env block; only
          # this detects an upstream re-tag + re-release of the pinned version).
          echo "${expected}  ${asset}" > "${workdir}/expected.sha256"
          (cd "${workdir}" && shasum -a 256 -c expected.sha256)

          # Layer 2 — provenance: identity-verify the asset against upstream's
          # Sigstore bundle. The certificate is bound to kyverno/kyverno's release
          # workflow at this exact version tag, so an asset swapped without upstream
          # repo write (CDN/asset tampering) cannot carry a valid signature, and the
          # digest above cannot have been minted by anything but that workflow.
          release_identity="https://github.com/kyverno/kyverno/.github/workflows/release.yaml"
          cosign verify-blob \
            --bundle "${workdir}/${asset}.sigstore.json" \
            --certificate-identity "${release_identity}@refs/tags/v${KYVERNO_CLI_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${workdir}/${asset}"

          tar -xzf "${workdir}/${asset}" -C "${workdir}" kyverno
          install -m 0755 "${workdir}/kyverno" /usr/local/bin/kyverno

      - name: Verify Kyverno CLI
        # Fails closed if the pinned CLI is not what CI actually got, or if it sits below
        # the floor the policies advertise via policies.kyverno.io/minversion.
        run: |
          set -Eeuo pipefail

          installed="$(kyverno version | awk '/^Version:/ { print $2 }' | sed 's/^v//')"
          if [[ "${installed}" != "${KYVERNO_CLI_VERSION}" ]]; then
            echo "::error::Kyverno CLI is ${installed}, expected the pinned ${KYVERNO_CLI_VERSION}" >&2
            exit 1
          fi

          # --no-doc matters: without it yq emits a `---` separator per file, and the
          # values read back include separators rather than versions.
          declared="$(yq -r --no-doc '.metadata.annotations."policies.kyverno.io/minversion"' \
            policies/*/*.yaml)"

          if [[ -z "${declared}" ]]; then
            echo "::error::no policy declares a policies.kyverno.io/minversion annotation" >&2
            exit 1
          fi

          # Validate EVERY declared floor, not just the maximum: a malformed or empty
          # annotation sorts below a valid one and would otherwise never be looked at,
          # leaving the guard silently fail-open for that policy.
          while IFS= read -r value; do
            if [[ ! "${value}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::policies.kyverno.io/minversion must be a semver version (got '${value}')" >&2
              exit 1
            fi
          done <<< "${declared}"

          floor="$(printf '%s\n' "${declared}" | sort -V | tail -n 1)"

          if [[ "$(printf '%s\n%s\n' "${floor}" "${installed}" | sort -V | head -n 1)" != "${floor}" ]]; then
            echo "::error::pinned Kyverno CLI ${installed} is below the catalog floor ${floor}" >&2
            exit 1
          fi

          echo "Kyverno CLI ${installed} pinned and at or above the catalog floor ${floor}."

      - name: Validate YAML
        run: yamllint .

      - name: Render catalog
        run: kubectl kustomize . > /dev/null

      - name: Test policy behavior
        # Discovers every tests/*/kyverno-test.yaml recursively, so a new policy's
        # fixture is executed as soon as it exists — no test-runner edit required.
        run: kyverno test . --require-tests --detailed-results --remove-color

      - name: Test policy structure
        run: bash scripts/test-policy-catalog.sh

      - name: Validate scripts and workflow
        run: |
          shellcheck scripts/test-policy-catalog.sh scripts/test-retired-repo-links.sh
          actionlint .github/workflows/ci.yaml
          zizmor .github/workflows/ci.yaml
          git diff --check
