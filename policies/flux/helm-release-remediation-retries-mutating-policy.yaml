---
# The catalog's Helm remediation defaults, on the MutatingPolicy API, which Kyverno keeps after
# classic ClusterPolicy mutate rules are retired. Same opt-in label, matched API, operations,
# skip conditions and patched result as the classic `helm-release-remediation-retries`
# ClusterPolicy (helm-release-remediation-retries.yaml, kept unregistered as the rollback
# form). tests/helm-release-remediation-retries-mutating-policy holds it to the classic
# fixtures.
#
# One mutation per classic rule, install and upgrade, each skipped on its own: an action whose
# strategy is RetryOnFailure, or whose authored retries is 0, is left entirely unchanged.
# Otherwise each adds only the missing leaves, retries: -1 and remediateLastFailure: true, so
# an authored value, including false and a finite retry count, is never overwritten.
#
# A JSONPatch mutation, not an ApplyConfiguration: the pinned CLI cannot apply an
# ApplyConfiguration to a custom resource ("type converter must not be nil"), so that form
# could not be tested. Every map value is dyn(): CEL infers a map's value type from its first
# entry, so a literal mixing a number and a boolean does not compile without it. Background
# evaluation is off and mutateExisting stays at its default (off), so, like the classic rules,
# it acts only on create and update admission requests.
#
# FLOOR: Kyverno 1.19.0, the CLI the behavior tests pin.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: helm-release-remediation-retries
  annotations:
    policies.kyverno.io/title: Helm Release Remediation Retries (MutatingPolicy)
    policies.kyverno.io/category: Flux
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: HelmRelease
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Defaults install and upgrade remediation to unlimited retries and
      preconfigures last-failure remediation for Flux HelmRelease v2 resources
      which opt in with the helm.toolkit.fluxcd.io/remediation: enabled label.
      MutatingPolicy form of the classic helm-release-remediation-retries policy.
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["helmreleases"]
  # The opt-in label is read from the incoming object, as the classic selector reads it. A
  # matchConstraints objectSelector would also match when only the stored object carries the
  # label, so an update that removes the label would still be mutated.
  matchConditions:
    - name: opted-in
      expression: >-
        object.metadata.?labels[?'helm.toolkit.fluxcd.io/remediation'].orValue('') == 'enabled'
  variables:
    # A missing retries value reads as 1 here, so only an authored 0 skips the action.
    - name: skipInstall
      expression: >-
        object.spec.?install.?strategy.?name.orValue('') == 'RetryOnFailure'
        || object.spec.?install.?remediation.?retries.orValue(1) == 0
    - name: skipUpgrade
      expression: >-
        object.spec.?upgrade.?strategy.?name.orValue('') == 'RetryOnFailure'
        || object.spec.?upgrade.?remediation.?retries.orValue(1) == 0
  mutations:
    # Install, the classic default-install-remediation rule.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.skipInstall ? [] :
          !object.spec.?install.hasValue()
          ? [JSONPatch{op: "add", path: "/spec/install",
              value: {"remediation": {"retries": dyn(-1), "remediateLastFailure": dyn(true)}}}]
          : !object.spec.install.?remediation.hasValue()
          ? [JSONPatch{op: "add", path: "/spec/install/remediation",
              value: {"retries": dyn(-1), "remediateLastFailure": dyn(true)}}]
          : (object.spec.install.remediation.?retries.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/install/remediation/retries", value: -1}])
            + (object.spec.install.remediation.?remediateLastFailure.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/install/remediation/remediateLastFailure", value: true}])
    # Upgrade, the classic default-upgrade-remediation rule.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.skipUpgrade ? [] :
          !object.spec.?upgrade.hasValue()
          ? [JSONPatch{op: "add", path: "/spec/upgrade",
              value: {"remediation": {"retries": dyn(-1), "remediateLastFailure": dyn(true)}}}]
          : !object.spec.upgrade.?remediation.hasValue()
          ? [JSONPatch{op: "add", path: "/spec/upgrade/remediation",
              value: {"retries": dyn(-1), "remediateLastFailure": dyn(true)}}]
          : (object.spec.upgrade.remediation.?retries.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/upgrade/remediation/retries", value: -1}])
            + (object.spec.upgrade.remediation.?remediateLastFailure.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/upgrade/remediation/remediateLastFailure", value: true}])
