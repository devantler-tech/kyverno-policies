---
# The catalog's auto-vpa: a port of the classic policies/best-practices/auto-vpa.yaml
# ClusterPolicy rules to the GeneratingPolicy API, which Kyverno keeps after classic
# ClusterPolicy generate rules are retired. The classic ClusterPolicy is a separate file.
#
# THIS IS THE REGISTERED FORM in the root kustomization.yaml. The classic file stays in the
# repository, unregistered, as the rollback form until every consumer has migrated: never
# apply both to one cluster, because both generate a VerticalPodAutoscaler for the same
# workload under the same name. The README's "Migrating to the GeneratingPolicy form"
# section is the consumer rollout and rollback procedure.
#
# Split into one policy per workload kind, mirroring the classic policy's three rules:
# GeneratingPolicy applies spec.matchConstraints to the whole policy, so three kinds with
# three different VPA bodies cannot share one policy without branching inside CEL.
#
# FLOOR: Kyverno 1.19.0. On 1.18.x spec.evaluation.generateExisting is schema-accepted but
# does not fire for PRE-EXISTING workloads (kyverno/kyverno#15722, a regression against the
# classic rule; fixed by kyverno/kyverno#16041 for 1.19.0 and never backported), so an
# existing workload would get its VPA only on its next CREATE/UPDATE admission. The
# minversion annotations below declare that floor.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: auto-vpa-deployment
  annotations:
    policies.kyverno.io/title: Auto VPA for Deployments (GeneratingPolicy)
    policies.kyverno.io/category: Autoscaling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Generates a recommendation-bounded VerticalPodAutoscaler for each Deployment.
      GeneratingPolicy form of the classic auto-vpa rule of the same name.
spec:
  # Parity with the classic rules' `synchronize: true` + `generateExisting: true`:
  # on GeneratingPolicy both live under spec.evaluation and default to false, so
  # omitting them would silently drop behavior the classic policy guarantees.
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  generate:
    # Every value is dyn(): CEL infers a map's value type from its first entry, so a
    # resource literal mixing strings with nested maps fails to compile without it.
    # Fields read off `object` are dyn and need string() before concatenation.
    - expression: >-
        generator.Apply(
          string(object.metadata.namespace),
          [
            {
              "apiVersion": dyn("autoscaling.k8s.io/v1"),
              "kind": dyn("VerticalPodAutoscaler"),
              "metadata": dyn({
                "name": string(object.metadata.name) + "-deployment",
                "namespace": string(object.metadata.namespace)
              }),
              "spec": dyn({
                "targetRef": dyn({
                  "apiVersion": "apps/v1",
                  "kind": "Deployment",
                  "name": string(object.metadata.name)
                }),
                "updatePolicy": dyn({"updateMode": "InPlaceOrRecreate"}),
                "resourcePolicy": dyn({
                  "containerPolicies": [
                    {
                      "containerName": dyn("*"),
                      "controlledResources": dyn(["cpu", "memory"]),
                      "controlledValues": dyn("RequestsAndLimits"),
                      "minAllowed": dyn({"cpu": "50m", "memory": "64Mi"}),
                      "maxAllowed": dyn({"cpu": "3", "memory": "6Gi"})
                    }
                  ]
                })
              })
            }
          ]
        )
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: auto-vpa-statefulset
  annotations:
    policies.kyverno.io/title: Auto VPA for StatefulSets (GeneratingPolicy)
    policies.kyverno.io/category: Autoscaling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: StatefulSet
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Generates a recommendation-bounded VerticalPodAutoscaler for each StatefulSet.
      GeneratingPolicy form of the classic auto-vpa rule of the same name.
spec:
  # Parity with the classic rules' `synchronize: true` + `generateExisting: true`:
  # on GeneratingPolicy both live under spec.evaluation and default to false, so
  # omitting them would silently drop behavior the classic policy guarantees.
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
  generate:
    - expression: >-
        generator.Apply(
          string(object.metadata.namespace),
          [
            {
              "apiVersion": dyn("autoscaling.k8s.io/v1"),
              "kind": dyn("VerticalPodAutoscaler"),
              "metadata": dyn({
                "name": string(object.metadata.name) + "-statefulset",
                "namespace": string(object.metadata.namespace)
              }),
              "spec": dyn({
                "targetRef": dyn({
                  "apiVersion": "apps/v1",
                  "kind": "StatefulSet",
                  "name": string(object.metadata.name)
                }),
                "updatePolicy": dyn({"updateMode": "Initial"}),
                "resourcePolicy": dyn({
                  "containerPolicies": [
                    {
                      "containerName": dyn("*"),
                      "controlledResources": dyn(["cpu", "memory"]),
                      "controlledValues": dyn("RequestsAndLimits"),
                      "minAllowed": dyn({"cpu": "50m", "memory": "64Mi"}),
                      "maxAllowed": dyn({"cpu": "3", "memory": "6Gi"})
                    }
                  ]
                })
              })
            }
          ]
        )
