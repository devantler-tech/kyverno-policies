---
# The catalog's auto-vpa, on the GeneratingPolicy API, which Kyverno keeps after classic
# ClusterPolicy generate rules are retired. For every workload whose VPA name fits, it generates
# the same VerticalPodAutoscaler as the classic `auto-vpa` ClusterPolicy, whose output
# tests/auto-vpa/generated-*-vpa.yaml pins. A longer-named workload, which the classic form
# cannot size, gets a shortened name (see vpaName below).
#
# This is the only auto-vpa form the catalog ships. Never apply it to a cluster that still
# runs a classic auto-vpa ClusterPolicy, because both generate a VerticalPodAutoscaler for
# the same workload under the same name. The README's "Migrating to the GeneratingPolicy
# form" section is the consumer rollout and rollback procedure.
#
# Split into one policy per workload kind, mirroring the classic policy's three rules:
# GeneratingPolicy applies spec.matchConstraints to the whole policy, so three kinds with
# three different VPA bodies cannot share one policy without branching inside CEL.
#
# FLOOR: Kyverno 1.19.0. On 1.18.x spec.evaluation.generateExisting is schema-accepted but
# does not fire for PRE-EXISTING workloads (kyverno/kyverno#15722, a regression against the
# classic rule; fixed by kyverno/kyverno#16041 for 1.19.0 and never backported), so an
# existing workload would get its VPA only on its next CREATE/UPDATE admission. The
# minversion annotations below declare that floor.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: auto-vpa-deployment
  annotations:
    policies.kyverno.io/title: Auto VPA for Deployments (GeneratingPolicy)
    policies.kyverno.io/category: Autoscaling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Generates a recommendation-bounded VerticalPodAutoscaler for each Deployment.
      GeneratingPolicy form of the classic auto-vpa rule of the same name.
spec:
  # Parity with the classic rules' `synchronize: true` + `generateExisting: true`:
  # on GeneratingPolicy both live under spec.evaluation and default to false, so
  # omitting them would silently drop behavior the classic policy guarantees.
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  # A VPA name, like the workload name, may be at most 253 characters. A name that fits is
  # <workload>-deployment. A longer one keeps as much of the workload name as fits, drops a
  # trailing "-" or "." the cut leaves (so it stays a valid DNS subdomain), and ends with
  # -deployment- and the first 10 hex digits of the full name's SHA-256, so two long names that
  # share a prefix still get different VPAs. The hash goes last because a name that fits
  # always ends in "deployment", which is not hex, so a shortened name never equals the name
  # another workload gets unshortened. The 11 in the cut is that "-" plus the 10 hash digits.
  variables:
    - name: workload
      expression: string(object.metadata.name)
    # An invalid or absent UID must fail evaluation, never produce a name-only owner.
    # Indexing the filtered singleton refuses empty and non-string identities too.
    - name: workloadUID
      expression: '[object.metadata.uid].filter(uid, type(uid) == string && size(uid) > 0)[0]'
    - name: vpaName
      expression: >-
        size(variables.workload) + size("-deployment") <= 253
        ? variables.workload + "-deployment"
        : variables.workload.substring(0, 253 - 11 - size("-deployment")).find("^.*[a-z0-9]")
          + "-deployment-" + sha256(variables.workload).substring(0, 10)
  generate:
    # Every value is dyn(): CEL infers a map's value type from its first entry, so a
    # resource literal mixing strings with nested maps fails to compile without it.
    # Fields read off `object` are dyn and need string() before concatenation.
    - expression: >-
        generator.Apply(
          string(object.metadata.namespace),
          [
            {
              "apiVersion": dyn("autoscaling.k8s.io/v1"),
              "kind": dyn("VerticalPodAutoscaler"),
              "metadata": dyn({
                "name": dyn(variables.vpaName),
                "namespace": dyn(string(object.metadata.namespace)),
                "ownerReferences": dyn([{
                  "apiVersion": "apps/v1",
                  "kind": "Deployment",
                  "name": string(object.metadata.name),
                  "uid": string(variables.workloadUID)
                }])
              }),
              "spec": dyn({
                "targetRef": dyn({
                  "apiVersion": "apps/v1",
                  "kind": "Deployment",
                  "name": string(object.metadata.name)
                }),
                "updatePolicy": dyn({"updateMode": "InPlaceOrRecreate"}),
                "resourcePolicy": dyn({
                  "containerPolicies": [
                    {
                      "containerName": dyn("*"),
                      "controlledResources": dyn(["cpu", "memory"]),
                      "controlledValues": dyn("RequestsAndLimits"),
                      "minAllowed": dyn({"cpu": "50m", "memory": "64Mi"}),
                      "maxAllowed": dyn({"cpu": "3", "memory": "6Gi"})
                    }
                  ]
                })
              })
            }
          ]
        )
---
