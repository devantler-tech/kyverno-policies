---
# The catalog's recommended-label defaults, on the MutatingPolicy API, which Kyverno keeps after
# classic ClusterPolicy mutate rules are retired. Same matched workloads, system-namespace
# boundary, name conditions and patched result as the classic `add-recommended-labels`
# ClusterPolicy (add-recommended-labels.yaml, kept unregistered as the rollback form).
# tests/add-recommended-labels-mutating-policy holds it to the classic fixtures.
#
# The classic preconditions become matchConditions: a workload with no name yet (a
# generateName-only create) or a name longer than the 63-character label-value limit is left
# alone. Each label is added only when its key is missing, as the classic +(...) anchors do,
# so an authored value is never replaced. A "/" in a label key is written "~1" in a JSONPatch
# path.
#
# Autogen is off: the policy matches Deployments, StatefulSets and DaemonSets, not Pods. A
# JSONPatch mutation keeps one mutation form across the catalog's MutatingPolicies (an
# ApplyConfiguration cannot be tested on the Flux custom resources). Background evaluation is
# off and mutateExisting stays at its default (off), so, like the classic rule, it acts only on
# create and update admission requests.
#
# FLOOR: Kyverno 1.19.0, the CLI the behavior tests pin.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-recommended-labels
  annotations:
    policies.kyverno.io/title: Add Recommended Labels (MutatingPolicy)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Adds missing app and app.kubernetes.io/name identity labels to workloads
      without overwriting values supplied by the workload author. MutatingPolicy
      form of the classic add-recommended-labels policy.
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: outside-kubernetes-system-namespaces
      expression: >-
        !(object.metadata.?namespace.orValue('') in ['kube-system', 'kube-public', 'kube-node-lease'])
    - name: name-is-a-label-value
      expression: >-
        object.metadata.?name.orValue('') != '' && size(object.metadata.name) <= 63
  variables:
    - name: name
      expression: string(object.metadata.name)
    - name: labels
      expression: object.metadata.?labels.orValue({})
    - name: templateLabels
      expression: object.spec.?template.?metadata.?labels.orValue({})
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (object.metadata.?labels.hasValue() ? [] :
            [JSONPatch{op: "add", path: "/metadata/labels", value: {}}])
          + ("app" in variables.labels ? [] :
            [JSONPatch{op: "add", path: "/metadata/labels/app", value: variables.name}])
          + ("app.kubernetes.io/name" in variables.labels ? [] :
            [JSONPatch{op: "add", path: "/metadata/labels/app.kubernetes.io~1name", value: variables.name}])
          + (object.spec.?template.?metadata.hasValue() ? [] :
            [JSONPatch{op: "add", path: "/spec/template/metadata", value: {}}])
          + (object.spec.?template.?metadata.?labels.hasValue() ? [] :
            [JSONPatch{op: "add", path: "/spec/template/metadata/labels", value: {}}])
          + ("app.kubernetes.io/name" in variables.templateLabels ? [] :
            [JSONPatch{op: "add", path: "/spec/template/metadata/labels/app.kubernetes.io~1name",
              value: variables.name}])
