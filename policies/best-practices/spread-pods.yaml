---
# Spreads a workload's replicas evenly across nodes: adds a topology spread constraint on
# kubernetes.io/hostname, keyed on the pod template's app.kubernetes.io/name label, to Deployments
# and StatefulSets whose pod template declares no spread constraints. Graduated from
# devantler-tech/platform's spread-pods (#47), which renders the upstream Kyverno sample with the
# platform's patches, as a MutatingPolicy with the same match, condition and patch. The platform's
# patches removed the sample's distributed: required opt-in label, so every named workload is
# spread; this port keeps that rendered behaviour.
#
# Existing topologySpreadConstraints are left exactly as authored, as the classic `+(...)` anchor
# did. DoNotSchedule makes the spread a hard rule: a replica that cannot be placed without
# exceeding a skew of one stays Pending.
# matchLabelKeys: [pod-template-hash] keeps a rolling update's old and new ReplicaSets from being
# counted together.
#
# SCOPE. The catalog skips the namespaces Kubernetes owns (the platform's copy skipped kube-system);
# a consumer appends its own exclusions as another matchCondition (op: add, path:
# /spec/matchConditions/-).
#
# FLOOR: Kyverno 1.19.0, the CLI the behavior tests pin.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: spread-pods
  annotations:
    policies.kyverno.io/title: Spread Pods Across Nodes (MutatingPolicy)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment, StatefulSet
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Adds a node topology spread constraint to Deployments and StatefulSets
      that carry an app.kubernetes.io/name pod template label and declare no
      spread constraints.
spec:
  evaluation:
    background:
      enabled: true
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: not-kubernetes-system-namespace
      expression: >-
        !(object.metadata.?namespace.orValue('') in ['kube-system', 'kube-public', 'kube-node-lease'])
    - name: has-name-label
      expression: >-
        object.spec.template.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != ''
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.template.spec.?topologySpreadConstraints.hasValue()
          ? []
          : [JSONPatch{
              op: "add",
              path: "/spec/template/spec/topologySpreadConstraints",
              value: [{
                "maxSkew": dyn(1),
                "topologyKey": dyn("kubernetes.io/hostname"),
                "whenUnsatisfiable": dyn("DoNotSchedule"),
                "matchLabelKeys": dyn(["pod-template-hash"]),
                "labelSelector": dyn({
                  "matchExpressions": dyn([{
                    "key": dyn("app.kubernetes.io/name"),
                    "operator": dyn("In"),
                    "values": dyn([string(object.spec.template.metadata.labels['app.kubernetes.io/name'])])
                  }])
                })
              }]
            }]
