---
# Denies pods, and the pod templates of workload controllers, that explicitly override the Pod
# Security Standards restricted profile. Graduated from devantler-tech/platform's
# validate-pod-security (#46) with the same checks, messages, match scope and Deny action; the
# platform's own namespace exclusions moved out to the consumer.
# Two additions to the platform's copy: a capability added back after dropping ALL is denied
# unless it is NET_BIND_SERVICE, and the pods/ephemeralcontainers subresource is matched.
#
# Controllers are matched directly, not through Kyverno's generated pod-controller rules (autogen
# is off), because at Kyverno 1.19 those do not cover ReplicationController. `podSpec` picks the
# pod spec out of each kind. Validating the controller template means a non-compliant template is
# refused when it is applied, where a GitOps pipeline reports the denial, instead of inside the
# controller when it creates pods. An update is judged like a create: an equally non-compliant live
# object does not grandfather the change.
#
# readOnlyRootFilesystem is not validated: the restricted profile does not require it.
#
# SCOPE. Only the namespaces Kubernetes itself owns are out of scope here. Every other exclusion is
# the consumer's: add a policies.kyverno.io/v1 PolicyException whose policyRefs name this policy and
# whose matchConditions select the namespaces it exempts (README, "Platform validation policies").
# Exclude by namespace, never by pod name alone: any pod can adopt a name in any namespace.
#
# FLOOR: Kyverno 1.19.0, the CLI the behavior tests pin.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-pod-security
  annotations:
    policies.kyverno.io/title: Validate Pod Security (PSS Restricted)
    policies.kyverno.io/category: Pod Security, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Validates that pods and the pod templates of workload controllers
      comply with the Pod Security Standards restricted profile: no privilege
      escalation, no privileged containers, non-root, all capabilities dropped
      and a RuntimeDefault or Localhost seccomp profile.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      # Ephemeral containers are added to a running Pod through this subresource, not through an
      # update of the Pod itself, so without it a debug container would bypass every check below.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: not-kubernetes-system-namespace
      expression: >-
        !(object.metadata.?namespace.orValue('') in [
          'kube-system', 'kube-public', 'kube-node-lease'])
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    # Every container the pod declares: regular, init and ephemeral.
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: allowedSeccompTypes
      expression: "['RuntimeDefault', 'Localhost']"
  validations:
    # The drop list must name ALL and nothing else. An empty list drops nothing, so it keeps the
    # runtime's default capabilities.
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          c.?securityContext.?privileged.orValue(false) == false &&
          c.?securityContext.?runAsNonRoot.orValue(false) == true &&
          c.?securityContext.?capabilities.?drop.hasValue() &&
          c.securityContext.capabilities.drop.size() > 0 &&
          c.securityContext.capabilities.drop.all(d, d == 'ALL'))
      message: >-
        All containers must set allowPrivilegeEscalation=false,
        privileged=false (or unset), runAsNonRoot=true, and drop
        ALL capabilities.
    # Dropping ALL does not stop a container adding capabilities back. The restricted profile
    # allows adding back only NET_BIND_SERVICE. This check is the catalog's addition to the
    # platform's copy, which inspected only the drop list.
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?capabilities.?add.orValue([]).all(a, a == 'NET_BIND_SERVICE'))
      message: >-
        Containers may add back only the NET_BIND_SERVICE capability.
    - expression: >-
        variables.podSpec.?securityContext.?seccompProfile.?type.orValue('')
        in variables.allowedSeccompTypes
      message: "Pod must use seccomp profile RuntimeDefault or Localhost."
    - expression: >-
        variables.containers.all(c,
          !c.?securityContext.?seccompProfile.hasValue() ||
          c.securityContext.seccompProfile.?type.orValue('')
          in variables.allowedSeccompTypes)
      message: >-
        Container seccomp profile must be RuntimeDefault or Localhost
        when set. Containers inherit the pod-level seccomp profile
        unless explicitly overridden.
