# Copied from devantler-tech/platform tests/validate-pdb-drain-safe/resources.yaml at
# 08be2b9daf0a5bd3cf518961b58d95b470bc8068, so the catalog policy is held to the
# decisions the platform pinned for its own copy.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: max-unavailable
  namespace: apps
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: max-unavailable
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: min-available
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: min-available
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: instance-manager-outside-longhorn
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: instance-manager-outside-longhorn
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cnpg-cluster
  namespace: apps
  labels:
    cnpg.io/cluster: db
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cnpg-cluster
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cert-manager
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: instance-manager-abc123
  namespace: longhorn-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: instance-manager-abc123
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: csi-attacher
  namespace: longhorn-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: csi-attacher
