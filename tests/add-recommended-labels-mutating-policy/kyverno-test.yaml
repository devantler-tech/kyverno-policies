---
# Parity spec for the MutatingPolicy port of add-recommended-labels.
#
# The rows below repeat the classic rule's rows in ../add-recommended-labels/kyverno-test.yaml,
# against the same fixture file and the same patched fixtures. Sharing the classic fixtures is
# the parity claim: an input set authored next to the new policy could drift with it and
# prove nothing.
#
# Two differences, both CLI behaviour rather than policy behaviour. A matched resource whose
# patch changes nothing is a `skip` for the classic rule and a `pass` here, so those rows
# expect `pass` with the unchanged fixture file as their patched output. A resource the
# policy does not select reports `Excluded`, which satisfies a `skip` row however the policy
# behaves, so those rows are left out: scripts/test-policy-catalog.sh compares every fixture
# resource after the classic and the MutatingPolicy forms instead.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-recommended-labels-mutating-policy-matches-classic-output
policies:
  - ../../policies/best-practices/add-recommended-labels-mutating-policy.yaml
resources:
  - ../add-recommended-labels/resources.yaml
results:
  - policy: add-recommended-labels
    resources:
      - apps/unlabelled-deployment
      - apps/authored-statefulset
      - apps/partial-daemonset
      # Accept side of the 63-character name boundary.
      - apps/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    patchedResources: ../add-recommended-labels/patched-resources.yaml
    result: pass
  - policy: add-recommended-labels
    resources:
      - apps/authored-deployment
    patchedResources: ../add-recommended-labels/resources.yaml
    result: pass
