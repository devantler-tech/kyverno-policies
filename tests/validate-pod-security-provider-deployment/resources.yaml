# Copied from devantler-tech/platform tests/validate-pod-security-provider-deployment/resources.yaml at
# 08be2b9daf0a5bd3cf518961b58d95b470bc8068, so the catalog policy is held to the
# decisions the platform pinned for its own copy.
---
# Mirrors the Deployment Crossplane's package manager generates in
# crossplane-system from a provider DeploymentRuntimeConfig. The DRC only ever
# supplies a CONTAINER securityContext, so this is the exact shape the admission
# webhook sees on every provider revision bump.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-container-seccomp-only
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      pkg.crossplane.io/revision: provider-container-seccomp-only
  template:
    metadata:
      labels:
        pkg.crossplane.io/revision: provider-container-seccomp-only
    spec:
      containers:
        - name: package-runtime
          image: xpkg.upbound.io/upbound/provider-aws-iam:v2.4.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
---
# The same Deployment once the DRC also sets the profile at POD level, which is
# the path validate-pod-security actually asserts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-pod-seccomp
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      pkg.crossplane.io/revision: provider-pod-seccomp
  template:
    metadata:
      labels:
        pkg.crossplane.io/revision: provider-pod-seccomp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: package-runtime
          image: xpkg.upbound.io/upbound/provider-aws-iam:v2.4.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
