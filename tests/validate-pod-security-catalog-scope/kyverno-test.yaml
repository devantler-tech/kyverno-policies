---
# The catalog validate-pod-security without a consumer exception (#46). It skips only the
# namespaces Kubernetes owns: a namespace the platform exempts through its own exception is in
# scope here, so its insecure pod is denied. A capability added back after dropping ALL is denied
# unless it is NET_BIND_SERVICE, in regular and init containers alike.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-pod-security-catalog-scope
policies:
  - ../../policies/security/validate-pod-security.yaml
resources:
  - resources.yaml
results:
  - policy: validate-pod-security
    isValidatingPolicy: true
    kind: Pod
    resources:
      - observability/hardened
      - apps/add-net-bind-service
    result: pass
  - policy: validate-pod-security
    isValidatingPolicy: true
    kind: Pod
    resources:
      - observability/insecure
      - apps/add-net-raw
      - apps/init-add-net-raw
    result: fail
  - policy: validate-pod-security
    isValidatingPolicy: true
    kind: Pod
    resources:
      - kube-system/insecure
      - kube-node-lease/insecure
    result: skip
