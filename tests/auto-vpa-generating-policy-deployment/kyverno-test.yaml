---
# Parity spec for the Deployment arm of the GeneratingPolicy port of auto-vpa.
#
# Split one Test per policy because GeneratingPolicy has no named rules: kyverno expands
# every results[] entry across every resource in the Test, and neither a per-result
# `resources` list nor `kind` narrows that, so a single Test carrying all three kinds
# reports six spurious cross-kind failures.
#
# The complete expectation preserves the classic output recorded under ../auto-vpa/
# and adds the exact workload owner reference. Sizing and names retain their original baseline.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auto-vpa-generating-policy-deployment-owns-workload
policies:
  - ../../policies/best-practices/auto-vpa-generating-policy.yaml
resources:
  - resources.yaml
results:
  - policy: auto-vpa-deployment
    resources:
      - test/shared
    generatedResource: generated-vpa.yaml
    kind: Deployment
    result: pass
