---
# yamllint disable rule:line-length
# The workload and VPA names below are longer than the line limit on purpose.
# A Deployment name whose suffixed VPA name is exactly 253 characters. It fits, so the VPA is
# named exactly as for any shorter workload, with no hash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
