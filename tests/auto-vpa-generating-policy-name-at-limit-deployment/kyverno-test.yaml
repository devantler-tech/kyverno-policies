---
# yamllint disable rule:line-length
# The workload and VPA names below are longer than the line limit on purpose.
# A Deployment name whose suffixed VPA name is exactly 253 characters. It fits, so the VPA is
# named exactly as for any shorter workload, with no hash. One Test per case, because
# GeneratingPolicy results expand across every resource in a Test.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auto-vpa-generating-policy-name-at-limit-deployment
policies:
  - ../../policies/best-practices/auto-vpa-generating-policy.yaml
resources:
  - resources.yaml
results:
  - policy: auto-vpa-deployment
    resources:
      - test/cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    generatedResource: generated-vpa.yaml
    kind: Deployment
    result: pass
