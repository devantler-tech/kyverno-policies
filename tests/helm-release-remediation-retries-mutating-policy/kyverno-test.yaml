---
# Parity spec for the MutatingPolicy port of helm-release-remediation-retries.
#
# The rows below repeat the classic rule's rows in ../helm-release-remediation-retries/kyverno-test.yaml,
# against the same fixture file and the same patched fixtures. Sharing the classic fixtures is
# the parity claim: an input set authored next to the new policy could drift with it and
# prove nothing.
#
# Two differences, both CLI behaviour rather than policy behaviour. A matched resource whose
# patch changes nothing is a `skip` for the classic rule and a `pass` here, so those rows
# expect `pass` with the unchanged fixture file as their patched output. A resource the
# policy does not select reports `Excluded`, which satisfies a `skip` row however the policy
# behaves, so those rows are left out: scripts/test-policy-catalog.sh compares every fixture
# resource after the classic and the MutatingPolicy forms instead.
#
# The classic test has one row set per rule; the MutatingPolicy applies both rules' mutations
# as one policy, so each resource appears once, with the patched fixture that holds its
# result after both actions.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: helm-release-remediation-retries-mutating-policy-matches-classic-output
policies:
  - ../../policies/flux/helm-release-remediation-retries-mutating-policy.yaml
resources:
  - ../helm-release-remediation-retries/resources.yaml
results:
  - policy: helm-release-remediation-retries
    isMutatingPolicy: true
    resources:
      - apps/missing-defaults
      - apps/remediate-on-failure-with-siblings
      - apps/upgrade-retry-on-failure
    patchedResources: ../helm-release-remediation-retries/install-patched-resources.yaml
    kind: HelmRelease
    result: pass
  - policy: helm-release-remediation-retries
    isMutatingPolicy: true
    resources:
      - apps/install-retry-on-failure
      - apps/explicit-unlimited-false-and-upgrade-strategy
    patchedResources: ../helm-release-remediation-retries/upgrade-patched-resources.yaml
    kind: HelmRelease
    result: pass
  - policy: helm-release-remediation-retries
    isMutatingPolicy: true
    resources:
      - apps/explicit-zero-false
      - apps/explicit-zero-with-flux-default
      - apps/both-sides-configured
      - apps/both-retry-on-failure
    patchedResources: ../helm-release-remediation-retries/resources.yaml
    kind: HelmRelease
    result: pass
