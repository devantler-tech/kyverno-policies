---
# The catalog validate-host-restrictions on its own (#46), against the platform's fixtures
# (resources.yaml) and one more pod (catalog-scope.yaml). Without a consumer list only the
# namespaces Kubernetes owns skip the host-access checks, so the platform's exempt
# observability/infrastructure-pod is refused here while the same pod in kube-system passes.
# consumer-parity-test.yaml holds the same fixtures to the platform's exact results once its
# namespaces are patched in (consumer/), which scripts/test-policy-catalog.sh runs.
#
# A ValidatingPolicy reports one result per resource, so each case is the combined outcome of the
# three checks: host paths, host namespaces, and hostUsers in a namespace opted into user
# namespaces.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-host-restrictions
policies:
  - ../../policies/security/validate-host-restrictions.yaml
resources:
  - resources.yaml
  - catalog-scope.yaml
# Declares the namespace labels the hostUsers check reads. Without it the opted-in namespace looks
# unlabelled and the hostUsers fail case would pass.
variables: values.yaml
results:
  # No host access, and hostUsers absent or explicitly false. CNPG pods and namespaces without the
  # opt-in label are out of the hostUsers check's scope, and Kubernetes-owned namespaces are out of
  # the host-access checks' scope.
  - policy: validate-host-restrictions
    resources:
      - userns-absent/ordinary-pod
      - userns-absent/explicit-false
      - userns-absent/unscoped-host-users
      - userns-enabled/explicit-unshared
      - userns-enabled/host-users-absent
      - userns-enabled/cnpg-instance
      - kube-system/system-host-pod
    kind: Pod
    result: pass
  # Host access outside the Kubernetes-owned namespaces, including one a consumer may exempt but
  # the catalog does not.
  - policy: validate-host-restrictions
    resources:
      - userns-absent/host-path
      - userns-absent/host-network
      - userns-absent/host-pid
      - userns-absent/host-ipc
      - userns-absent/helper-pod-create-pvc
      - observability-app/namespace-lookalike
      - observability/infrastructure-pod
    kind: Pod
    result: fail
  # The regression a conditional hostUsers mutation cannot catch.
  - policy: validate-host-restrictions
    resources:
      - userns-enabled/explicit-host-users
    kind: Pod
    result: fail
